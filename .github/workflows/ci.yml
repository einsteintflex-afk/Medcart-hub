name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: medcart, POSTGRES_PASSWORD: medcart, POSTGRES_DB: medcart_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U medcart" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt bandit
      - name: Tests on PostgreSQL
        run: pytest -q
        env: { MEDCART_DATABASE_URL: "postgresql+psycopg://medcart:medcart@localhost:5432/medcart_test" }
      - name: Migrations upgrade, drift check, downgrade
        env: { MEDCART_DATABASE_URL: "postgresql+psycopg://medcart:medcart@localhost:5432/medcart_test" }
        run: |
          python -c "from app.db import Base, engine; Base.metadata.drop_all(engine); engine.dispose()"
          psql postgresql://medcart:medcart@localhost/medcart_test -c "DROP TYPE IF EXISTS role, consultstatus, contribstatus, verificationstatus, paymentstatus CASCADE; DROP TABLE IF EXISTS alembic_version"
          alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - run: bandit -q -r app -ll
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
