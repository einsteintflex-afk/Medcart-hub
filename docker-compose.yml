services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: medcart, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}", POSTGRES_DB: medcart }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U medcart"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
  api:
    build: ./backend
    environment:
      MEDCART_ENV: ${MEDCART_ENV:-production}
      MEDCART_DATABASE_URL: postgresql+psycopg://medcart:${POSTGRES_PASSWORD}@db:5432/medcart
      MEDCART_REDIS_URL: redis://redis:6379/0
      MEDCART_JWT_SECRET: ${MEDCART_JWT_SECRET:?set a long random secret}
      MEDCART_DATA_ENCRYPTION_KEYS: ${MEDCART_DATA_ENCRYPTION_KEYS:?generate with Fernet.generate_key()}
      MEDCART_PAYMENT_MODE: ${MEDCART_PAYMENT_MODE:-live}
      MEDCART_PAYSTACK_SECRET_KEY: ${MEDCART_PAYSTACK_SECRET_KEY:-}
      MEDCART_ANTHROPIC_API_KEY: ${MEDCART_ANTHROPIC_API_KEY:-}
      MEDCART_LANGUAGE_PROVIDER: ${MEDCART_LANGUAGE_PROVIDER:-none}
      MEDCART_GOOGLE_API_KEY: ${MEDCART_GOOGLE_API_KEY:-}
      MEDCART_CORS_ORIGINS: ${MEDCART_CORS_ORIGINS:-["https://app.example.com"]}
      MEDCART_TRUST_PROXY_HEADERS: "true"
      MEDCART_SCHEDULER_ENABLED: "true"
      MEDCART_UPLOAD_DIR: /data/uploads
      MEDCART_TURN_URLS: ${MEDCART_TURN_URLS:-[]}
      MEDCART_TURN_SECRET: ${MEDCART_TURN_SECRET:-}
    volumes: [uploads:/data/uploads]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  web:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [api]
volumes: { pgdata: {}, uploads: {} }
