services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: medcart, POSTGRES_PASSWORD: medcart, POSTGRES_DB: medcart }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  api:
    build: ./backend
    environment:
      MEDCART_DATABASE_URL: postgresql+psycopg://medcart:medcart@db:5432/medcart
      MEDCART_REDIS_URL: redis://redis:6379/0
      MEDCART_JWT_SECRET: ${MEDCART_JWT_SECRET:?set a long random secret}
      MEDCART_PAYMENT_MODE: ${MEDCART_PAYMENT_MODE:-simulator}
      MEDCART_PAYSTACK_SECRET_KEY: ${MEDCART_PAYSTACK_SECRET_KEY:-}
      MEDCART_ANTHROPIC_API_KEY: ${MEDCART_ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
    depends_on: [db, redis]
volumes: { pgdata: {} }
